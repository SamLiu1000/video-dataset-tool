<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <defs>
    <!-- 纯黄背景 -->
    <linearGradient id="yellowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFC107"/>
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="bgShadow" x="-15%" y="-15%" width="135%" height="145%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="0.8" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <g filter="url(#bgShadow)">
    <rect x="10" y="10" width="120" height="120" rx="20" ry="20" fill="url(#yellowBg)"/>
  </g>

  <!-- 2x2 白色大块（大图模式） -->
  <g filter="url(#cardShadow)">
    <!-- 左上 -->
    <rect x="27" y="27" width="38" height="38" rx="4" ry="4" fill="#FFFFFF"/>
    <!-- 右上 -->
    <rect x="75" y="27" width="38" height="38" rx="4" ry="4" fill="#FFFFFF"/>
    <!-- 左下 -->
    <rect x="27" y="75" width="38" height="38" rx="4" ry="4" fill="#FFFFFF"/>
    <!-- 右下 -->
    <rect x="75" y="75" width="38" height="38" rx="4" ry="4" fill="#FFFFFF"/>
  </g>
</svg>